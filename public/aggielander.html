<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16110f"><title>Aggielander — Your day. Your campus.</title><meta name="description" content="Your student calendar and campus events, together. Plan your day and find your place at Texas A&M."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23500000'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' font-family='serif' fill='white'%3Ea%3C/text%3E%3C/svg%3E"><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap');
/* Night maroon theme: --wine fills buttons and active states, --accent (gold) carries text highlights. */
:root{color-scheme:dark;--wine:#8c1d2c;--accent:#e2b04a;--rose:#f0a3ad;--ink:#f3ece6;--muted:#a8998f;--paper:#16110f;--surface:#221a17;--surface2:#2c221e;--line:#3a2d28;--green:#8fcaa5;--purple:#bba6e6;--orange:#e9a668;--blue:#93b8de}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px 'DM Sans',Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select{touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button{border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.shell{display:grid;grid-template-columns:234px 1fr;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:234px;background:#1b1512;border-right:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font:800 23px Manrope,Arial;letter-spacing:-1px;color:var(--ink)}
.brandmark{background:var(--wine);color:var(--accent);display:grid;place-items:center;border-radius:11px;width:36px;height:36px;font:italic bold 29px Georgia;box-shadow:0 0 0 1px #e2b04a33}
.brand small{font-size:10px;letter-spacing:1.5px;display:block;margin:5px 0 0;color:var(--muted)}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--muted);margin:48px 12px 15px}
.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;margin:4px 0;background:none;border-radius:9px;color:#c4b5aa;text-align:left;font-weight:550}
.navbtn.active{color:var(--accent);background:#3a1a1f}
.navbtn:hover{background:var(--surface2)}
.navbtn.active svg{stroke-width:2}
.side-note{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 15px;line-height:1.6}
.side-note strong{display:block;font-size:13px;margin:7px 0}
.side-note p{color:var(--muted);font-size:12px;margin:4px 0}
.side-foot{font-size:10px;color:var(--muted);margin:20px 8px 0}
.main{grid-column:2;min-width:0}
.topbar{height:79px;border-bottom:1px solid var(--line);padding:0 42px;display:flex;align-items:center;justify-content:space-between;background:#1b1512cc;backdrop-filter:blur(6px)}
.topbar .eyebrow{color:var(--muted);font-size:12px}
.profile{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;font-size:10px;border:1px solid var(--line);border-radius:20px;color:var(--muted);background:var(--surface2)}
.dot{height:6px;width:6px;background:var(--green);border-radius:50%}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:var(--accent);font-weight:700}
.content{max-width:1460px;padding:35px 42px 45px;margin:auto}
.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}
h1{font:750 29px Manrope,Arial;letter-spacing:-1px;margin:0 0 8px}
h2{font:750 17px Manrope,Arial;margin:0}
h3{font:700 15px Manrope,Arial;margin:0}
p{line-height:1.6}
.sub{color:var(--muted);margin:0;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:8px;background:var(--wine);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{filter:brightness(1.2)}
.btn.light{border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.btn.subtle{background:#3a1a1f;color:var(--accent)}
.btn.small{padding:8px 11px;font-size:11px}
.textbtn{background:transparent;color:var(--accent);font-size:12px;padding:4px 0;font-weight:600}
.hero{background:linear-gradient(135deg,#5a0d18,#2a0a0f 70%);border:1px solid #5a2129;color:white;border-radius:16px;padding:28px 30px;position:relative;overflow:hidden;min-height:181px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.hero .kicker{font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:12px}
.hero h2{font-size:27px;letter-spacing:-.8px;max-width:440px}
.hero p{color:#e3c9c6;font-size:12px;margin:9px 0 18px;max-width:420px}
.hero .btn{background:var(--accent);color:#2a0d10;padding:9px 14px}
.hero-art{width:220px;height:140px;position:relative;flex-shrink:0;color:var(--accent)}
.arch{position:absolute;width:126px;height:150px;border:1px solid #e2b04a55;border-radius:80px 80px 0 0;bottom:-35px;left:38px;box-shadow:0 0 0 17px #e2b04a12,0 0 0 34px #e2b04a0a}
.tower{position:absolute;left:80px;top:21px;width:42px;height:111px;border:1px solid #d9b26a;border-top:4px solid #d9b26a}
.tower:before{content:'';position:absolute;top:-18px;left:7px;width:25px;height:14px;border:1px solid #d9b26a}
.tower:after{content:'';position:absolute;top:-31px;left:17px;width:1px;height:12px;background:#d9b26a}
.clock{position:absolute;top:13px;left:12px;border:1px solid #d9b26a;width:16px;height:16px;border-radius:50%}
.clock:after{content:'';position:absolute;top:3px;left:7px;width:4px;height:5px;border-left:1px solid;border-bottom:1px solid}
.towerlines{position:absolute;left:91px;top:80px;width:20px;height:50px;background:repeating-linear-gradient(90deg,transparent 0 5px,#d9b26a 5px 6px)}
.star{position:absolute;font-size:24px;top:24px;right:35px}
.hero-art .tag{position:absolute;bottom:0;left:24px;font-size:9px;letter-spacing:3px;color:#e3c9a6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 27px}
.stat{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:11px;display:flex;gap:13px;align-items:center}
.stat-icon{width:37px;height:37px;display:grid;place-items:center;border-radius:10px;background:#3a1a1f;color:var(--rose)}
.stat:nth-child(2) .stat-icon{background:#352716;color:var(--orange)}
.stat:nth-child(3) .stat-icon{background:#1d2c23;color:var(--green)}
.stat:nth-child(4) .stat-icon{background:#29233a;color:var(--purple)}
.stat b{font:750 23px Manrope,Arial;display:block;line-height:1.2}
.stat span{color:var(--muted);font-size:11px}
.home-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.12fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.section-head .sub{font-size:11px;margin-top:4px}
.tinydate{font-size:11px;color:var(--muted)}
.agenda-row{display:flex;gap:16px;margin:0 0 16px;align-items:stretch}
.agenda-time{width:59px;padding-top:10px;font-size:11px;color:var(--muted);flex-shrink:0;text-align:right}
.agenda-block{padding:12px 14px;border-left:3px solid var(--purple);border-radius:0 7px 7px 0;background:#26202f;flex:1;min-width:0}
.agenda-block.personal{border-color:var(--green);background:#1c2a22}
.agenda-block.assignment{border-color:var(--orange);background:#2e2416}
.agenda-block.campus{border-color:var(--rose);background:#33191d}
.agenda-block.university{border-color:var(--blue);background:#1b2530}
.agenda-block .meta{margin-top:6px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.meta svg{width:12px;height:12px}
.agenda-block h3{font-size:12px;line-height:1.5}
.free{border:1px dashed #3f5a49;border-radius:7px;margin:3px 0 17px 75px;color:var(--green);font-size:10px;padding:11px;background:#1a221d;display:flex;align-items:center;gap:7px}
.free svg{width:14px;height:14px}
.event-list{display:grid;gap:12px}
.event-mini{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;background:#1d1613}
.event-tile{width:50px;height:56px;border-radius:8px;display:grid;place-items:center;color:var(--accent);background:#33271c;flex-shrink:0}
.event-tile svg{width:24px;height:24px}
.event-mini:nth-child(2) .event-tile{background:#1f2b23;color:var(--green)}
.event-mini:nth-child(3) .event-tile{background:#2a2236;color:var(--purple)}
.event-info{flex:1;min-width:0}
.event-info h3{font-size:12px;margin:6px 0}
.event-info p{margin:3px 0;color:var(--muted);font-size:10px}
.label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--orange);font-weight:650}
.label.career{color:var(--orange)}
.label.community{color:var(--green)}
.label.social{color:var(--purple)}
.label.academic{color:var(--blue)}
.roundadd{height:29px;min-width:29px;border:1px solid var(--line);background:var(--surface2);border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.roundadd svg{width:14px;height:14px}
.roundadd.saved{background:#1c2a22;border-color:#2f4a3a;color:var(--green)}
.fit{color:var(--green);font-size:10px;display:inline-flex;align-items:center;gap:4px}
.fit.bad{color:#ef9a78}
.fit svg{height:12px;width:12px}
.panel-bottom{margin-top:16px;padding:12px 0 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.deadline{margin-top:22px;padding:18px 22px;display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.deadline svg{color:var(--accent)}
.deadline h3{font-size:12px;margin:0 0 4px}
.deadline p{font-size:11px;margin:0;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:13px;top:11px;color:var(--muted);width:17px;height:17px}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px 11px 39px;background:var(--surface);outline-offset:0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:20px;font-size:11px}
.chip{min-height:36px}
.quickbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.quickbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chip.active{background:var(--wine);color:#fff;border-color:var(--wine)}
.switch{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--green);cursor:pointer}
.switch input{accent-color:var(--accent);width:16px;height:16px}
.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.event-card{border:1px solid var(--line);background:var(--surface);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
.event-card.featured{border-color:#e2b04a88;box-shadow:0 0 0 1px #e2b04a33}
.card-art{height:125px;background:#2e2219;position:relative;display:flex;align-items:center;justify-content:center;color:var(--accent);overflow:hidden}
.card-art:before,.card-art:after{content:'';position:absolute;width:160px;height:160px;border:1px solid currentColor;opacity:.15;border-radius:50%;right:-20px;top:-50px}
.card-art:after{right:25px;top:0}
.card-art svg{width:43px;height:43px;stroke-width:1}
.card-art.community{background:#1d2a20;color:var(--green)}
.card-art.social{background:#2a2133;color:var(--purple)}
.card-art.academic{background:#1b2633;color:var(--blue)}
.card-art .artlabel{position:absolute;left:16px;bottom:14px;font:750 12px Manrope;letter-spacing:2px;text-transform:uppercase}
.card-art .datebadge{position:absolute;right:13px;top:12px;padding:7px 10px;border-radius:6px;background:#00000066;color:var(--ink);font-size:10px}
.card-body{padding:18px;display:flex;flex-direction:column;flex:1}
.card-body h3{margin:8px 0 10px;font-size:15px}
.card-body p{font-size:12px;color:var(--muted);min-height:39px;margin:0 0 15px}
.detail-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin:9px 0}
.detail-line svg{height:14px;width:14px}
.card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:17px;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.badge{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--surface2)}
.badge.gold{color:var(--accent);border-color:#e2b04a55}
.badge.blue{color:var(--blue);border-color:#93b8de55}
.steps{padding-left:18px;font-size:12px;color:var(--muted);line-height:1.8}
.badge.green{color:var(--green);border-color:#8fcaa555}
.badge.purple{color:var(--purple);border-color:#bba6e655}
.empty{padding:40px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty svg{width:35px;height:35px;margin-bottom:10px}
.finder{background:linear-gradient(135deg,#2a0f14,#1f1714);border:1px solid #5a2129;border-radius:14px;padding:20px 22px;margin-bottom:18px}
.finder h2{display:flex;align-items:center;gap:8px;color:var(--ink)}
.finder h2 svg{color:var(--accent)}
.finder .sub{margin:6px 0 14px}
.finder form{display:flex;gap:10px;flex-wrap:wrap}
.finder input{flex:1;min-width:220px;border:1px solid #5a2129;border-radius:9px;padding:12px 14px;background:#120d0c}
.finder .examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.finder .examples button{font-size:11px;padding:6px 11px;border-radius:20px;background:transparent;border:1px dashed var(--line);color:var(--muted)}
.finder .examples button:hover{color:var(--accent);border-color:var(--accent)}
.understood{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.understood .badge{color:var(--accent);border-color:#e2b04a55}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:650}
.filters select,.filters input[type=date]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
.filters .toggles{display:flex;gap:16px;flex-wrap:wrap;align-items:center;grid-column:1/-1;padding-top:4px}
.filters .toggles label{flex-direction:row;align-items:center;gap:7px;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink);cursor:pointer}
.filters .toggles input{accent-color:var(--accent);width:16px;height:16px}
.loadmore{display:flex;justify-content:center;margin-top:22px}
.calendar-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
.cal-head{display:grid;grid-template-columns:56px repeat(7,minmax(105px,1fr));min-width:800px;border-bottom:1px solid var(--line)}
.cal-head>div{text-align:center;padding:14px 5px;font-size:10px;color:var(--muted);border-left:1px solid var(--line)}
.cal-head b{display:inline-grid;place-items:center;font:700 20px Manrope;margin-top:6px;color:var(--ink);width:32px;height:32px}
.cal-head .today b{background:var(--wine);color:#fff;border-radius:50%}
.cal-body{display:grid;grid-template-columns:56px repeat(7,minmax(105px,1fr));min-width:800px;position:relative}
.time-col{position:relative;height:660px}
.time-col span{position:absolute;right:8px;font-size:9px;color:var(--muted)}
.day-col{height:660px;position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 54px,#2a211d 54px,#2a211d 55px)}
.day-col.today{background-color:#1f1815}
.cal-event{position:absolute;left:4px;right:4px;overflow:hidden;border:0;border-left:3px solid var(--purple);background:#2a2236;color:#ddd0f3;padding:5px 6px;text-align:left;border-radius:4px;font-size:10px;line-height:1.4;min-height:24px}
.cal-event b{display:block;font-size:10px}
.cal-event small{font-size:9px}
.cal-event.personal{border-color:var(--green);background:#1c2a22;color:#b6dcc3}
.cal-event.campus{border-color:var(--rose);background:#3a1a1f;color:#f6c4ca}
.cal-event.university{background:#1b2533;border-color:var(--blue);color:#c3d7ee}
.cal-event.assignment{background:#2e2416;border-color:var(--orange);color:#f2cc9c}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{height:7px;width:7px;background:var(--purple);border-radius:50%}
.bottom-note{font-size:10px;color:var(--muted);margin-top:22px;text-align:center}
.modal-back{position:fixed;inset:0;background:#000000aa;backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:470px;padding:26px;max-height:90vh;overflow:auto}
.modal .section-head{margin-bottom:20px}
.close{background:var(--surface2);color:var(--muted);border-radius:50%;width:28px;height:28px;font-size:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}
.modal p{color:var(--muted);font-size:13px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.warning{background:#2e2416;color:#f2cc9c;border:1px solid #5a4426;padding:13px;border-radius:8px;font-size:12px;line-height:1.6;margin:16px 0}
.toast{position:fixed;bottom:25px;left:calc(50% + 100px);transform:translateX(-50%);padding:13px 20px;border-radius:10px;background:#2f4a3a;color:#fff;box-shadow:0 5px 25px #0008;z-index:200;font-size:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.settings-card p{font-size:12px;color:var(--muted)}
.settings-card .btn{margin:5px 5px 5px 0}
.statusline{font-size:11px;color:var(--green);padding-top:14px}
.daylist{display:flex;gap:8px;flex-wrap:wrap}
.daylist button{padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:11px}
.daylist .active{background:var(--wine);color:white}
.agenda-view{max-width:850px}
.cal-nav{display:flex;gap:8px;align-items:center}
.iconbtn{padding:8px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px}
.iconbtn svg{width:16px;height:16px}
.error{color:#f08a7a;font-size:12px}
.hidden{display:none!important}

@media(min-width:1500px){.hero{min-height:210px}
.hero-art{margin-right:60px}
.content{padding-top:40px}
.event-mini{padding:16px}
}

@media(max-width:1150px){.sidebar{width:195px;padding:28px 15px}
.shell{grid-template-columns:195px 1fr}
.brand{font-size:20px}
.content{padding:28px 25px}
.topbar{padding:0 25px}
.explore-grid{grid-template-columns:repeat(2,1fr)}
.stat{padding:14px 11px;gap:8px}
.stat-icon{width:29px;height:32px}
.stat b{font-size:20px}
.home-grid{gap:16px}
.panel{padding:17px}
.hero-art{width:155px}
.hero h2{font-size:25px}
.toast{left:calc(50% + 80px)}
}

@media(max-width:850px){.home-grid{grid-template-columns:1fr}
.stats{gap:9px}
.stat-icon{display:none}
.hero-art{display:none}
.split{grid-template-columns:1fr}
.heading{align-items:flex-start}

function home(){let items=allItems().filter(x=>x.date===day(0)),count=items.filter(x=>x.category!=='assignment').length,deadlines=allItems().filter(x=>x.category==='assignment'&&x.date>=day(0)&&x.date<=day(6));let upcoming=events.filter(e=>e.date===day(0));let freeEvents=upcoming.filter(e=>!conflicts(e).length&&!state.saved.includes(e.id));return heading('Howdy, Aggie.','Let’s make a little room for everything that matters.')+`<section class="hero"><div><div class="kicker">YOUR DAY. YOUR CAMPUS. ONE PLACE.</div><h2>A full schedule.<br>A little more possibility.</h2><p>Classes, deadlines, and the moments in between.<br>Find your balance, right here in Aggieland.</p><button class="btn" onclick="eventRange='today';navigate('explore')">See all events today ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="arch"></div><div class="tower"><div class="clock"></div></div><div class="towerlines"></div><div class="star">✧</div><div class="tag">HELLO, AGGIELAND</div></div></section><div class="stats"><div class="stat"><div class="stat-icon">${icon('calendar')}</div><div><b>${count}</b><span>Commitments today</span></div></div><div class="stat"><div class="stat-icon">${icon('book')}</div><div><b>${deadlines.length}</b><span>Deadlines this week</span></div></div><div class="stat"><div class="stat-icon">${icon('compass')}</div><div><b>${upcoming.length}</b><span>Campus events today</span></div></div><div class="stat"><div class="stat-icon">${icon('spark')}</div><div><b>${freeEvents.length}</b><span>New events that fit</span></div></div></div><div class="home-grid"><section class="panel"><div class="section-head"><div><h2>My day</h2><p class="sub">Your plans, in one place.</p></div><span class="tinydate">${today.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span></div>${agendaRows(items)}<div class="panel-bottom"><span class="tinydate">A little planning goes a long way.</span><button class="textbtn" onclick="navigate('calendar')">Full calendar ↗</button></div></section><section class="panel"><div class="section-head"><div><h2>Campus today</h2><p class="sub">Something for your next free hour.</p></div><span class="pill">LIVE · TAMU CALENDAR</span></div><div class="event-list">${upcoming.length?[upcoming[0],upcoming[2],upcoming[1]].filter(Boolean).map(mini).join(''):`<div class="empty">${eventsStatus==='ok'?'No more campus events today.':eventsMsg()}</div>`}</div><div class="panel-bottom"><span class="tinydate">${freeEvents.length} new events fit your schedule</span><button class="textbtn" onclick="eventRange='today';navigate('explore')">Explore campus ↗</button></div></section></div><div class="deadline">${icon('calendar')}<div><h3>University dates, without the last-minute scramble.</h3><p>Keep academic dates alongside your classes. Add a university date or import your calendar.</p></div><button class="textbtn" style="margin-left:auto;white-space:nowrap" onclick="navigate('settings')">Manage ↗</button></div>`}
const rangeLabels={today:'Today',tomorrow:'Tomorrow',week:'Next 7 days',weekend:'This weekend',all:'All upcoming',custom:'Custom dates'};

function eventCard(e){const badges=[e.featured&&['gold','★ Featured'],e.priceLabel&&[e.price===0?'green':'',e.priceLabel],e.networking&&['purple','Networking'],e.free&&['gold','Freebies'],e.grad&&['blue','Grad']].filter(Boolean);return `<article class="event-card ${e.featured?'featured':''}"><div class="card-art ${e.category}">${icon(e.icon)}<span class="datebadge">${e.date===day(0)?'TODAY':pretty(e.date)}</span><span class="artlabel">${esc(e.category)}</span></div><div class="card-body"><span class="label ${e.category}">${esc(e.tag)}</span><h3><button class="textbtn" style="font:inherit;color:inherit;text-align:left" onclick="eventDetails('${e.id}')">${esc(e.title)}</button></h3>${badges.length?`<div class="badges">${badges.map(([c,t])=>`<span class="badge ${c}">${esc(t)}</span>`).join('')}</div>`:''}<p>${esc(e.description)}</p><div class="detail-line">${icon('clock')}${span(e)}</div><div class="detail-line">${icon('pin')}${esc(e.location)}</div>${e.host?`<div class="detail-line">${icon('users')}${esc(e.host)}</div>`:''}<div class="card-actions">${fitBadge(e)}${addButton(e)}</div></div></article>`}

function optionList(get){const m={};for(const e of events)for(const v of [].concat(get(e)||[]))if(v)m[v]=(m[v]||0)+1;return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}

// Turns plain English ("free food and networking at Mays this week") into Explore filters.
function ask(text){clearFilters();if(!String(text).trim())return;askText=String(text).trim();const t=' '+askText.toLowerCase().replace(/[^a-z0-9$&'\s-]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ')+' ',has=re=>re.test(t),got={};

if(has(/\b(featured|big|major|important|highlights?|must see|top)\b/)){filt.sig='featured';got.sig='Featured'}else if(has(/\bfor students\b/)){filt.sig='students';got.sig='Open to students'}
const typeWords=[[/\b(sports?|games?|athletics?|football|basketball|volleyball|soccer|baseball|softball|tennis|swim\w*)\b/,'Sports & Athletics'],[/\b(arts?|music|concerts?|shows?|theat(er|re)|films?|movies?|exhibits?|exhibitions?|performances?|entertainment)\b/,'Arts & Entertainment'],[/\b(talks?|lectures?|speakers?|workshops?|conferences?|training|seminars?|forums?|panels?|learn)\b/,'Speakers, Forums, Conferences, Training & Workshops'],[/\b(open houses?|receptions?)\b/,'Open Houses & Receptions'],[/\bdeadlines?\b/,'Deadlines'],[/\b(academic calendar|registration|holidays?|breaks?|no class(es)?|drop date)\b/,'Academic Calendar'],[/\binternational\b/,'International Students'],[/\b(campus life|clubs?|organizations?|orgs?|student life)\b/,'Campus Life']],knownTypes=new Set(events.flatMap(e=>e.types||[]));
const tw=typeWords.find(([re,v])=>knownTypes.has(v)&&has(re));if(tw){filt.type=tw[1];got.type=tw[1]}
if(has(/\b(fun|hang out|social|party|parties|chill)\b/)){category='social';got.category='Social'}else if(has(/\b(careers?|jobs?|internships?|resumes?)\b/)&&!filt.net){category='career';got.category='Career'}else if(has(/\b(study|studying|tutoring|research|academic)\b/)){category='academic';got.category='Academic'}
// Words that appear in many department names (or are place names like Bryan-College Station) say nothing about which department.
const generic=new Set(['texas','a&m','department','dept','the','and','college','school','services','service','university','center','office','program','programs','student','students','calendar','community','general','for','events','event','food','free','career','careers','sports','arts','music','international','life','health','week','campus','new','station','bryan','graduate','grad','professional','experiment','institute','extension']);let best='',bestScore=0;const used=new Set();for(const [d] of optionList(e=>e.host)){const hits=d.toLowerCase().split(/[^a-z&]+/).filter(w=>w.length>=3&&!generic.has(w)&&t.includes(' '+w+' '));if(hits.length>bestScore){best=d;bestScore=hits.length;used.clear();hits.forEach(w=>used.add(w))}}if(best){filt.dept=best;got.dept=best}
const tag=optionList(e=>e.tags).map(([v])=>v).find(v=>v.length>=4&&!generic.has(v.toLowerCase())&&!used.has(v.toLowerCase())&&!Object.values(got).some(g=>{const x=g.toLowerCase(),y=v.toLowerCase();return x.includes(y)||y.includes(x)})&&t.includes(' '+v.toLowerCase()+' '));if(tag){filt.tag=tag;got.tag='#'+tag}
const filler=/^(i|i'm|im|want|wanna|would|like|to|go|do|find|me|my|a|an|the|some|something|any|anything|events?|things?|stuff|with|at|on|in|of|for|and|or|this|that|next|near|around|please|show|get|see|can|where|what|is|are|there|day|days|time|week|weekend|today|tonight|tomorrow|free|food|cheap|under|less|than|\$?\d+)$/;
if(!Object.keys(got).length){query=askText.toLowerCase().split(/\s+/).filter(w=>w&&!filler.test(w)).join(' ');if(query&&!filteredEvents().length)query=query.split(' ')[0]}
// Nothing matches everything? Loosen the least specific filters first and say which ones were dropped.
const relaxed=[],undo={tag:()=>filt.tag='',category:()=>category='all',sig:()=>filt.sig='',type:()=>filt.type='',dept:()=>filt.dept=''};for(const k of Object.keys(undo)){if(filteredEvents().length||!got[k])continue;undo[k]();relaxed.push(got[k]);delete got[k]}
const labels=Object.values(got),n=filteredEvents().length;askNote=labels.length||query?`Showing ${labels.map(g=>`<span class="badge">${esc(g)}</span>`).join('')}${query?` events matching “${esc(query)}”`:''} · ${n} ${n===1?'event':'events'}${relaxed.length?` (nothing matched everything, so I dropped ${relaxed.map(esc).join(', ')})`:''}${n?'':'. Try different words or a wider date range.'} <button class="textbtn" onclick="clearFilters()">Clear</button>`:`Couldn’t pick out any filters from that. Try mentioning a day, a department, “free food” or “networking”.`;render()}
function explore(){const es=filteredEvents(),adv=[category!=='all',filt.type,filt.dept,filt.tag,filt.sig,fits,eventRange==='custom'].filter(Boolean).length,chip=(on,label,act)=>`<button class="chip ${on?'active':''}" aria-pressed="${!!on}" onclick="${act};shown=60;render()">${label}</button>`;return heading('Your campus is calling.','Find something you love. Make room for something new.',false)+finder()+`<div class="quickbar" role="toolbar" aria-label="Quick filters">${[['today','Today'],['tomorrow','Tomorrow'],['week','This week'],['weekend','Weekend'],['all','Anytime']].map(([k,t])=>chip(eventRange===k,t,`eventRange='${k}';filt.from=filt.to=''`)).join('')}<span class="sep"></span>${chip(filt.net,'Networking','filt.net=!filt.net')}${chip(filt.freebies,'Freebies','filt.freebies=!filt.freebies')}${chip(filt.grad,'Grad students','filt.grad=!filt.grad')}<button class="chip ${adv?'active':''}" aria-expanded="${showFilters}" onclick="showFilters=!showFilters;render()">${showFilters?'Hide filters':'More filters'}${adv?` (${adv})`:''}</button></div>${filtersPanel()}<div class="toolbar"><span id="results" class="tinydate">${es.length} ${es.length===1?'event':'events'} to explore</span>${adv||filt.net||filt.freebies||filt.grad||query||eventRange!=='today'?'<button class="textbtn" onclick="clearFilters()">Clear all</button>':''}</div><div class="explore-grid" id="event-grid">${eventGrid(es)}</div><div class="loadmore" id="loadmore">${moreButton(es)}</div>`}
function weekDates(){let d=new Date(today);d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);return Array.from({length:7},(_,i)=>{let n=new Date(d);n.setDate(d.getDate()+i);return dateKey(n)})}
function calendar(){let dates=weekDates(),items=allItems(),selected=day(agendaOffset);return heading('A little clarity for your week.','Classes, commitments, and campus life, together.')+`<div class="toolbar cal-tools"><div class="cal-nav"><button class="iconbtn" aria-label="Previous week" onclick="weekOffset--;render()">${icon('left')}</button><button class="iconbtn" aria-label="Next week" onclick="weekOffset++;render()">${icon('right')}</button><button class="btn light small" onclick="weekOffset=0;agendaOffset=0;render()">Today</button><strong style="font-size:13px;margin-left:8px">${pretty(dates[0])} – ${pretty(dates[6])}, ${localDate(dates[6]).getFullYear()}</strong></div><div style="margin-left:auto;display:flex;gap:7px"><button class="chip ${calMode==='week'?'active':''}" onclick="calMode='week';render()">Week</button><button class="chip ${calMode==='agenda'?'active':''}" onclick="calMode='agenda';render()">Agenda</button><button class="btn light small" onclick="exportICS()">${icon('download')} Export</button></div></div>${calMode==='week'?`<div class="calendar-wrap"><div class="cal-head"><div></div>${dates.map(d=>`<div class="${d===day(0)?'today':''}">${localDate(d).toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}<br><b>${localDate(d).getDate()}</b></div>`).join('')}</div><div class="cal-body"><div class="time-col">${Array.from({length:12},(_,i)=>`<span style="top:${i*55+4}px">${(i+8)%12||12} ${i+8>=12?'PM':'AM'}</span>`).join('')}</div>${dates.map(d=>{let entries=items.filter(x=>x.date===d&&!x.allDay&&x.category!=='assignment'&&mins(x.end)>480&&mins(x.start)<1200).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day-col ${d===day(0)?'today':''}">${entries.map(x=>{const overlapping=entries.filter(y=>mins(y.start)<mins(x.end)&&mins(y.end)>mins(x.start));const lane=overlapping.indexOf(x);return `<button class="cal-event ${esc(x.category)}" style="top:${Math.max(0,(mins(x.start)-480)/60*55)}px;height:${Math.max(26,(Math.min(1200,mins(x.end))-Math.max(480,mins(x.start)))/60*55-3)}px;${overlapping.length>1?`left:calc(${lane/overlapping.length*100}% + 3px);width:calc(${100/overlapping.length}% - 6px);right:auto;`:''}" onclick="itemDetails('${esc(x.id)}')"><b>${esc(x.title)}</b><small>${time(x.start)}</small></button>`}).join('')}</div>`}).join('')}</div></div><div class="legend">${[['var(--purple)','Classes'],['var(--green)','Personal'],['var(--rose)','Campus events'],['var(--orange)','Assignments'],['var(--blue)','University']].map(([c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div><section class="panel" style="margin-top:22px"><h2 style="margin-bottom:16px">Deadlines & outside calendar hours</h2>${outsideRows(items.filter(x=>dates.includes(x.date)&&(x.category==='assignment'||mins(x.start)<480||mins(x.end)>1200)))}</section>`:`<div class="daylist" style="margin-bottom:20px">${Array.from({length:7},(_,i)=>`<button class="${agendaOffset===i?'active':''}" onclick="agendaOffset=${i};render()">${i===0?'Today':pretty(day(i))}</button>`).join('')}</div><section class="panel agenda-view"><div class="section-head"><h2>${localDate(selected).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</h2></div>${agendaRows(items.filter(x=>x.date===selected))}</section>`}`}
function outsideRows(items){return items.length?items.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(x=>`<div class="event-mini" style="margin-top:8px"><div class="stat-icon">${icon(x.category==='assignment'?'book':'clock')}</div><div class="event-info"><h3>${esc(x.title)}</h3><p>${pretty(x.date)} · ${when(x)}${x.category==='assignment'?' deadline':''}</p></div><button class="textbtn" onclick="itemDetails('${esc(x.id)}')">Details ↗</button></div>`).join(''):'<p class="sub">No deadlines or outside-hours commitments this week.</p>'}
function settings(){return heading('Make it your own.','Bring in your calendar and keep your plans close.',false)+`<div class="split"><section class="panel settings-card"><div class="stat-icon">${icon('calendar')}</div><h2 style="margin-top:18px">Connect Google Calendar</h2><p>Show your Google Calendar, including your TAMU account, alongside campus events. It refreshes every time you open Aggielander.</p>${state.gcalUrl?`<div class="statusline">Connected · ${state.items.filter(x=>x.gcal).length} events in the next 60 days</div><button class="btn light" onclick="syncGcal(true)">Refresh now</button><button class="btn light" onclick="disconnectGcal()">Disconnect</button>`:`<ol class="steps"><li>Open <a href="https://calendar.google.com/calendar/r/settings" target="_blank" rel="noopener">Google Calendar settings</a>, signed in to your TAMU account.</li><li>Under <b>Settings for my calendars</b>, choose your calendar, then <b>Integrate calendar</b>.</li><li>Copy <b>Secret address in iCal format</b> and paste it below.</li></ol><form onsubmit="event.preventDefault();connectGcal(this.u.value)"><div class="field"><input name="u" type="url" required placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" aria-label="Secret address in iCal format"></div><button class="btn">Connect</button></form>`}<p style="font-size:11px">The link is saved only in this browser. Anyone with it can see your calendar, so don’t share it.</p></section><section class="panel settings-card"><div class="stat-icon">${icon('upload')}</div><h2 style="margin-top:18px">Import a calendar file</h2><p>Import individual events from a calendar file (.ics). Imported events appear alongside your classes and campus plans.</p><button class="btn" onclick="document.getElementById('icsfile').click()">${icon('upload')} Import .ics file</button><p>Supports individual timed and all-day events. For recurring schedules, export individual occurrences first. Aggielander skips recurring series and timezone-defined events rather than importing incorrect times.</p><div class="statusline">${state.items.filter(x=>x.imported).length} imported events</div></section><section class="panel settings-card"><div class="stat-icon">${icon('download')}</div><h2 style="margin-top:18px">Take your plans with you</h2><p>Download your combined calendar and import it into Google Calendar, Apple Calendar, or Outlook. This is a file export; calendars do not sync automatically.</p><button class="btn light" onclick="exportICS()">${icon('download')} Export my calendar</button><div class="statusline">${allItems().length} commitments in your calendar</div></section><section class="panel settings-card"><div class="stat-icon">${icon('spark')}</div><h2 style="margin-top:18px">A fresh start</h2><p>Your plans save in this browser. Clearing removes everything you’ve added and saved in this browser.</p><button class="btn light" onclick="askReset()">Clear my data</button></section><section class="panel settings-card"><span class="pill">ABOUT</span><h2 style="margin-top:18px">Built around your day.</h2><p>Aggielander helps students organize their commitments and discover campus life that fits.</p><p>Campus events come live from the public calendar.tamu.edu feed. Aggielander is an independent student project, not affiliated with Texas A&amp;M. Personal data stays in this browser.</p></section></div>`}
function render(){document.getElementById('nav').innerHTML=[['home','home','Overview'],['calendar','calendar','My calendar'],['explore','compass','Explore campus'],['settings','settings','My setup']].map(([id,ic,text])=>`<button class="navbtn ${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="navigate('${id}')">${icon(ic)}${text}</button>`).join('');document.getElementById('app').innerHTML=({home,explore,calendar,settings}[page])()+`<footer class="bottom-note">Campus events from calendar.tamu.edu · Your plans are saved in this browser</footer>`;}
function eventDetails(id){const e=events.find(x=>x.id===id)||(state.eventCache||{})[id];if(!e)return;showModal(`<div class="section-head"><span class="label ${e.category}">${esc(e.tag)}</span>${closeButton()}</div><h2 style="font-size:22px">${esc(e.title)}</h2><p>${esc(e.description)}</p><div class="detail-line">${icon('calendar')}${pretty(e.date)} · ${span(e)}${e.priceLabel?' · '+esc(e.priceLabel):''}</div><div class="detail-line">${icon('pin')}${esc(e.location)}</div><p>Hosted by ${esc(e.host)}${e.url?` · <a href="${esc(e.url)}" target="_blank" rel="noopener">${e.url.includes("calendar.tamu.edu")?"View on calendar.tamu.edu":"More info"} ↗</a>`:''}</p>${fitBadge(e)}<p style="font-size:11px">Saving adds this event to your Aggielander calendar. It does not register you for an event.</p><div class="actions"><button class="btn light" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();${state.saved.includes(e.id)?`removeEvent('${e.id}')`:`addEvent('${e.id}')`}">${state.saved.includes(e.id)?'Remove from calendar':'Add to my calendar'}</button></div>`)}
function itemDetails(id){const x=allItems().find(x=>x.id===id);if(!x)return;if(state.saved.includes(id))return eventDetails(id);showModal(`<div class="section-head"><span class="label">${esc(x.category)}</span>${closeButton()}</div><h2>${esc(x.title)}</h2><div class="detail-line">${icon('calendar')}${pretty(x.date)}</div><div class="detail-line">${icon('clock')}${x.category==='assignment'?time(x.start)+' deadline':span(x)}</div><div class="detail-line">${icon('pin')}${esc(x.location||'No location added')}</div><div class="actions"><button class="btn light" onclick="openForm('${esc(id)}')">Edit</button><button class="btn" onclick="deleteItem('${esc(id)}')">Remove</button></div>`)}
function deleteItem(id){state.items=state.items.filter(x=>x.id!==id);persist();closeModal();render();toast('Commitment removed')}
function openForm(id){const x=state.items.find(x=>x.id===id)||{title:'',category:'personal',date:day(0),start:'15:00',end:'16:00',location:''};showModal(`<div class="section-head"><h2>${id?'Edit':'Add a'} commitment</h2>${closeButton()}</div><form id="commit-form"><div class="field"><label for="title">What’s the plan?</label><input id="title" name="title" placeholder="Study session, assignment, coffee…" required maxlength="120" value="${esc(x.title)}"></div><div class="form-grid"><div class="field"><label for="category">Category</label><select name="category" id="category" onchange="document.getElementById('endfield').classList.toggle('hidden',this.value==='assignment');document.getElementById('startlabel').textContent=this.value==='assignment'?'Due time':'Start time'">${[['personal','Personal'],['class','Class'],['assignment','Assignment deadline'],['university','University date']].map(([k,v])=>`<option value="${k}" ${x.category===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="date">Date</label><input type="date" id="date" name="date" required value="${esc(x.date)}"></div><div class="field"><label for="start" id="startlabel">${x.category==='assignment'?'Due time':'Start time'}</label><input type="time" id="start" name="start" required value="${esc(x.start)}"></div><div class="field ${x.category==='assignment'?'hidden':''}" id="endfield"><label for="end">End time</label><input type="time" id="end" name="end" required value="${esc(x.end)}"></div></div><div class="field"><label for="location">Location (optional)</label><input id="location" name="location" placeholder="Building, room, or online" maxlength="150" value="${esc(x.location)}"></div><div id="form-error" class="error" role="alert"></div><div id="form-warning"></div><div class="actions"><button type="button" class="btn light" onclick="closeModal()">Cancel</button><button class="btn" type="submit">${id?'Save changes':'Add commitment'}</button></div></form>`);document.getElementById('commit-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let item={id:id||'custom-'+crypto.randomUUID(),title:f.get('title').trim(),category:f.get('category'),date:f.get('date'),start:f.get('start'),end:f.get('end'),location:f.get('location').trim()};if(!item.title)return;if(item.category==='assignment')item.end=item.start;else if(item.end<=item.start){document.getElementById('form-error').textContent='Choose an end time after the start time.';return}const overlaps=item.category==='assignment'?[]:conflicts(item);if(overlaps.length&&!e.target.dataset.confirmed){document.getElementById('form-warning').innerHTML=`<div class="warning">Overlaps with ${overlaps.map(o=>esc(o.title)).join(', ')}. Click save again to keep this commitment anyway.</div>`;e.target.dataset.confirmed='yes';e.target.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',()=>{delete e.target.dataset.confirmed},{once:true}));return}state.items=state.items.filter(x=>x.id!==item.id);state.items.push(item);persist();closeModal();render();toast(id?'Commitment updated':'Commitment added')}}
function askReset(){showModal(`<div class="section-head"><h2>Start fresh?</h2>${closeButton()}</div><p>This removes all your commitments and saved events from this browser. It can’t be undone.</p><div class="actions"><button class="btn light" onclick="closeModal()">Keep my plans</button><button class="btn" onclick="state=seed();persist();closeModal();render();toast('Your data was cleared')">Clear my data</button></div>`)}
function icsEscape(v){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aggielander//Student Calendar//EN','CALSCALE:GREGORIAN'];for(const x of allItems()){let start=x.date.replace(/-/g,'')+'T'+x.start.replace(':','')+'00';let end=x.date.replace(/-/g,'')+'T'+x.end.replace(':','')+'00';if(x.category==='assignment'){let d=new Date(x.date+'T'+x.start+':00');d.setMinutes(d.getMinutes()+1);end=dateKey(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00'}lines.push('BEGIN:VEVENT','UID:'+icsEscape(x.id)+'@aggielander','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+icsEscape(x.title),'LOCATION:'+icsEscape(x.location||''),'DESCRIPTION:'+icsEscape(x.category==='assignment'?'Assignment deadline':'Aggielander commitment'),'END:VEVENT')}lines.push('END:VCALENDAR');let folded=lines.flatMap(l=>{let chunks=[];while(l.length>70){chunks.push(l.slice(0,70));l=' '+l.slice(70)}return [...chunks,l]});const blob=new Blob([folded.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Aggielander_Calendar.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Calendar exported')}
function parseICS(text){const blocks=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1);let imported=[],skipped=0;const val=s=>s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');for(const block of blocks){const props={};for(const line of block.split(/\r?\n/)){const ix=line.indexOf(':');if(ix<0)continue;const name=line.slice(0,ix),v=line.slice(ix+1);props[name.split(';')[0]]={name,value:v}}if(props.RRULE||props.RECURRENCEID||props['RECURRENCE-ID']||!props.DTSTART||props.DTSTART.name.includes('TZID=')){skipped++;continue}const raw=props.DTSTART.value;function parse(v){if(/^\d{8}$/.test(v))return {date:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),time:'00:00',allDay:true};if(!/^\d{8}T\d{6}Z?$/.test(v))return null;const s=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8)+'T'+v.slice(9,11)+':'+v.slice(11,13)+':'+v.slice(13,15)+(v.endsWith('Z')?'Z':'');const d=new Date(s);return Number.isNaN(d.getTime())?null:{date:dateKey(d),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}let a=parse(raw),b=props.DTEND?parse(props.DTEND.value):null;if(!a){skipped++;continue}if(a.allDay){if(b){const span=(localDate(b.date)-localDate(a.date))/86400000;if(span>1){skipped++;continue}}b={date:a.date,time:'23:59'};a.time='00:00'}if(!b){let end=Math.min(1439,mins(a.time)+60);b={date:a.date,time:String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0')}}if(a.date!==b.date||b.time<=a.time){skipped++;continue}let uid=props.UID?.value||[props.SUMMARY?.value,a.date,a.time].join('-');let id='import-'+Array.from(uid).map(c=>c.charCodeAt(0).toString(16)).join('');if(state.items.some(x=>x.id===id)||imported.some(x=>x.id===id)){skipped++;continue}imported.push({id,title:val(props.SUMMARY?.value||'Imported event').slice(0,120),date:a.date,start:a.time,end:b.time,category:'personal',location:val(props.LOCATION?.value||'').slice(0,150),imported:true})}return {imported,skipped}}
document.getElementById('icsfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw new Error('Use a calendar file smaller than 2 MB.');const content=await file.text();if(!content.includes('BEGIN:VCALENDAR'))throw new Error('Please choose a valid .ics calendar file.');const r=parseICS(content);state.items.push(...r.imported);persist();render();toast(`${r.imported.length} events imported${r.skipped?'; '+r.skipped+' unsupported or duplicate events skipped':''}`)}catch(err){toast(err.message||'Could not read this calendar file.')}e.target.value=''};
async function syncGcal(manual){if(!state.gcalUrl)return false;try{const r=await fetch('/api/gcal?url='+encodeURIComponent(state.gcalUrl)),d=await r.json();if(!r.ok)throw new Error(d.error);state.items=state.items.filter(x=>!x.gcal).concat(d.events.map(e=>({...e,category:'personal',gcal:true})));persist();render();if(manual)toast(`Google Calendar synced · ${d.events.length} events`);return true}catch(err){if(manual)toast(err.message||'Couldn’t sync Google Calendar');return false}}
async function connectGcal(u){state.gcalUrl=u.trim();if(!await syncGcal(true)){delete state.gcalUrl;persist();render()}}
function disconnectGcal(){delete state.gcalUrl;state.items=state.items.filter(x=>!x.gcal);persist();render();toast('Google Calendar disconnected')}
render();
syncGcal();
fetch('/api/events').then(r=>r.ok?r.json():null).then(d=>{events=d?.events||[];liveEvents=!!events.length;eventsStatus=d?'ok':'error';render()}).catch(()=>{eventsStatus='error';render()});
</script></body></html>
