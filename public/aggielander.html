const key='aggielander-v1';let today=new Date();today.setHours(0,0,0,0);const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const day=offset=>{let d=new Date(today);d.setDate(d.getDate()+offset);return dateKey(d)};const localDate=s=>new Date(s+'T12:00:00');const pretty=s=>localDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});const time=t=>{let [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};const mins=t=>{let[h,m]=t.split(':').map(Number);return h*60+m};
function seed(){let items=[];for(let o=-7;o<15;o++){let d=localDate(day(o));if(d.getDay()>0&&d.getDay()<6){items.push({id:'class-'+o,title:o%2?'Engineering Project Control':'Construction Systems',date:day(o),start:'13:00',end:'14:15',category:'class',location:'Zachry Engineering',demo:true});}}items.push({id:'study',title:'Study session',date:day(0),start:'16:00',end:'17:00',category:'personal',location:'Evans Library',demo:true},{id:'assignment',title:'Project controls assignment',date:day(0),start:'23:59',end:'23:59',category:'assignment',location:'Course submission',demo:true},{id:'deadline2',title:'Research paper outline',date:day(2),start:'23:59',end:'23:59',category:'assignment',location:'Course submission',demo:true},{id:'uni',title:'Academic planning reminder',date:day(3),start:'09:00',end:'09:30',category:'university',location:'Check your university portal',demo:true});return {items,saved:[]}}
let state;try{state=JSON.parse(localStorage.getItem(key));if(!state||!Array.isArray(state.items)||!Array.isArray(state.saved))throw 0;}catch{state=seed()}
let liveEvents=false;let events=[{id:'career',title:'Build your next opportunity',date:day(0),start:'14:30',end:'15:30',category:'career',location:'MSC, Room 2400',description:'A relaxed resume workshop and conversation about finding your next internship.',host:'Campus career community',icon:'briefcase',tag:'Career workshop'},{id:'club',title:'Find your people',date:day(0),start:'13:30',end:'14:30',category:'community',location:'Rudder Plaza',description:'Meet student organizations and explore a new interest with fellow Aggies.',host:'Student organizations',icon:'users',tag:'Club meetup'},{id:'coffee',title:'Coffee & campus conversations',date:day(0),start:'17:30',end:'18:30',category:'social',location:'MSC Student Lounge',description:'Take a study break, meet someone new, and enjoy complimentary coffee.',host:'Student social circle',icon:'spark',tag:'Free refreshments',free:true},{id:'wellness',title:'A little room to breathe',date:day(0),start:'12:00',end:'12:45',category:'community',location:'Academic Plaza',description:'An outdoor mindfulness break to reset before your afternoon classes.',host:'Student wellness community',icon:'compass',tag:'Wellness break'},{id:'research',title:'Research, without the overwhelm',date:day(1),start:'10:00',end:'11:00',category:'academic',location:'Evans Library',description:'Learn practical ways to organize sources and approach your next research paper.',host:'Graduate student community',icon:'book',tag:'Grad student workshop'},{id:'makers',title:'Make something after class',date:day(1),start:'17:00',end:'18:30',category:'social',location:'Zachry Engineering',description:'Bring an idea and spend an evening making something with other students.',host:'Campus maker community',icon:'spark',tag:'Creative evening'},{id:'network',title:'Meet the next generation of builders',date:day(2),start:'14:30',end:'15:30',category:'career',location:'Rudder Tower',description:'Practice your introduction and make connections across engineering disciplines.',host:'Engineering student community',icon:'briefcase',tag:'Networking'}];
let page='home',weekOffset=0,category='all',fits=false,query='',eventRange='today',agendaOffset=0,calMode='week';
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Browser storage is unavailable. Keep this tab open to retain changes.')}}
function allItems(){return [...state.items,...state.saved.map(id=>events.find(e=>e.id===id)||(state.eventCache||{})[id]).filter(Boolean).map(e=>({...e,category:'campus',eventCategory:e.category,demo:!e.url}))]}
function conflicts(e){return allItems().filter(x=>x.id!==e.id&&x.category!=='assignment'&&x.date===e.date&&x.start<e.end&&x.end>e.start)}
function toast(s){document.getElementById('toast').innerHTML=`<div class="toast">${esc(s)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function navigate(p){page=p;render();window.scrollTo(0,0)}
function fitBadge(e){let c=conflicts(e);return `<span class="fit ${c.length?'bad':''}">${icon(c.length?'alert':'check')}${c.length?'Schedule conflict':'Fits your schedule'}</span>`}
function addButton(e,mini=false){let saved=state.saved.includes(e.id);return `<button class="${mini?'roundadd '+(saved?'saved':''):'btn small '+(saved?'light':'')}" onclick="${saved?`removeEvent('${e.id}')`:`addEvent('${e.id}')`}" aria-label="${saved?'Remove':'Add'} ${esc(e.title)} ${saved?'from':'to'} calendar">${icon(saved?'check':'plus')}${mini?'':saved?'Added':'Add to calendar'}</button>`}
function addEvent(id){const e=events.find(x=>x.id===id);if(!e||state.saved.includes(id))return;(state.eventCache??={})[id]=e;let c=conflicts(e);if(c.length){showModal(`<div class="section-head"><h2>There’s a little overlap</h2>${closeButton()}</div><p><strong>${esc(e.title)}</strong> overlaps with:</p><div class="warning">${c.map(x=>`<strong>${esc(x.title)}</strong><br>${time(x.start)} – ${time(x.end)}`).join('<br><br>')}</div><p>You can still save it if you plan to attend part of the event.</p><div class="actions"><button class="btn light" onclick="closeModal()">Go back</button><button class="btn" onclick="confirmAdd('${id}')">Add anyway</button></div>`)}else confirmAdd(id)}
function confirmAdd(id){if(!state.saved.includes(id))state.saved.push(id);persist();closeModal();render();toast('Event added to your calendar')}
function removeEvent(id){state.saved=state.saved.filter(x=>x!==id);if(state.eventCache)delete state.eventCache[id];persist();render();toast('Event removed from your calendar')}
function closeButton(){return '<button class="close" onclick="closeModal()" aria-label="Close dialog">×</button>'}
function closeModal(){document.getElementById('overlay').innerHTML='';if(window.lastFocus?.isConnected)window.lastFocus.focus()}
function showModal(html){window.lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Aggielander dialog">${html}</section></div>`;document.querySelector('.modal input,.modal button')?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelector('.modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function heading(title,subtitle,button=true){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${subtitle}</p></div>${button?`<button class="btn" onclick="openForm()">${icon('plus')} Add commitment</button>`:''}</div>`}
function agendaRows(items){if(!items.length)return `<div class="empty">${icon('spark')}<p>A little space in your day.</p><button class="textbtn" onclick="navigate('explore')">Find something on campus →</button></div>`;return items.sort((a,b)=>a.start.localeCompare(b.start)).map(x=>`<div class="agenda-row"><div class="agenda-time">${x.category==='assignment'?'DUE':time(x.start).replace(' ','<br>')}</div><button class="agenda-block ${esc(x.category)}" style="text-align:left" onclick="itemDetails('${esc(x.id)}')"><h3>${esc(x.title)}</h3><span class="meta">${icon(x.category==='assignment'?'clock':'pin')}${esc(x.category==='assignment'?time(x.start)+' deadline':x.location||'No location added')}</span></button></div>`).join('')}
function mini(e){return `<article class="event-mini"><div class="event-tile">${icon(e.icon)}</div><div class="event-info"><span class="label ${e.category}">${esc(e.tag)}</span><h3><button class="textbtn" style="color:inherit;font:inherit;text-align:left" onclick="eventDetails('${e.id}')">${esc(e.title)}</button></h3><p>${time(e.start)} · ${esc(e.location)}</p>${fitBadge(e)}</div>${addButton(e,true)}</article>`}
function home(){let items=allItems().filter(x=>x.date===day(0)),count=items.filter(x=>x.category!=='assignment').length,deadlines=allItems().filter(x=>x.category==='assignment'&&x.date>=day(0)&&x.date<=day(6));let upcoming=events.filter(e=>e.date===day(0));let freeEvents=upcoming.filter(e=>!conflicts(e).length&&!state.saved.includes(e.id));return heading('Howdy, Aggie.','Let’s make a little room for everything that matters.')+`<section class="hero"><div><div class="kicker">YOUR DAY. YOUR CAMPUS. ONE PLACE.</div><h2>A full schedule.<br>A little more possibility.</h2><p>Classes, deadlines, and the moments in between.<br>Find your balance, right here in Aggieland.</p><button class="btn" onclick="eventRange='today';navigate('explore')">See all events today ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="arch"></div><div class="tower"><div class="clock"></div></div><div class="towerlines"></div><div class="star">✧</div><div class="tag">HELLO, AGGIELAND</div></div></section><div class="stats"><div class="stat"><div class="stat-icon">${icon('calendar')}</div><div><b>${count}</b><span>Commitments today</span></div></div><div class="stat"><div class="stat-icon">${icon('book')}</div><div><b>${deadlines.length}</b><span>Deadlines this week</span></div></div><div class="stat"><div class="stat-icon">${icon('compass')}</div><div><b>${upcoming.length}</b><span>Campus events today</span></div></div><div class="stat"><div class="stat-icon">${icon('spark')}</div><div><b>${freeEvents.length}</b><span>New events that fit</span></div></div></div><div class="home-grid"><section class="panel"><div class="section-head"><div><h2>My day</h2><p class="sub">Your plans, in one place.</p></div><span class="tinydate">${today.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</span></div>${agendaRows(items)}<div class="panel-bottom"><span class="tinydate">A little planning goes a long way.</span><button class="textbtn" onclick="navigate('calendar')">Full calendar ↗</button></div></section><section class="panel"><div class="section-head"><div><h2>Campus today</h2><p class="sub">Something for your next free hour.</p></div><span class="pill">${liveEvents?'LIVE · TAMU CALENDAR':'DEMO EVENTS'}</span></div><div class="event-list">${[upcoming[0],upcoming[2],upcoming[1]].filter(Boolean).map(mini).join('')}</div><div class="panel-bottom"><span class="tinydate">${freeEvents.length} new events fit your schedule</span><button class="textbtn" onclick="eventRange='today';navigate('explore')">Explore campus ↗</button></div></section></div><div class="deadline">${icon('calendar')}<div><h3>University dates, without the last-minute scramble.</h3><p>Keep academic dates alongside your classes. Add a university date or import your calendar.</p></div><button class="textbtn" style="margin-left:auto;white-space:nowrap" onclick="navigate('settings')">Manage ↗</button></div>`}
function filteredEvents(){return events.filter(e=>(eventRange==='all'||e.date===day(0))&&(category==='all'||e.category===category||category==='free'&&e.free)&&(!fits||!conflicts(e).length)&&(`${e.title} ${e.description} ${e.location} ${e.tag}`.toLowerCase().includes(query.toLowerCase())))}
function eventCard(e){return `<article class="event-card"><div class="card-art ${e.category}">${icon(e.icon)}<span class="datebadge">${e.date===day(0)?'TODAY':pretty(e.date)}</span><span class="artlabel">${esc(e.category)}</span></div><div class="card-body"><span class="label ${e.category}">${esc(e.tag)}</span><h3><button class="textbtn" style="font:inherit;color:inherit;text-align:left" onclick="eventDetails('${e.id}')">${esc(e.title)}</button></h3><p>${esc(e.description)}</p><div class="detail-line">${icon('clock')}${time(e.start)} – ${time(e.end)}</div><div class="detail-line">${icon('pin')}${esc(e.location)}</div><div class="card-actions">${fitBadge(e)}${addButton(e)}</div></div></article>`}
function updateEvents(){let es=filteredEvents();document.getElementById('event-grid').innerHTML=es.length?es.map(eventCard).join(''):'<div class="empty">No events match these filters. Try another category or turn off “Fits my schedule.”</div>';document.getElementById('results').textContent=`${es.length} ${es.length===1?'event':'events'} to explore`}
function explore(){return heading('Your campus is calling.','Find something you love. Make room for something new.',false)+`<div class="toolbar"><div class="search">${icon('search')}<input aria-label="Search campus events" placeholder="Search events, interests, places…" value="${esc(query)}" oninput="query=this.value;updateEvents()"></div><select class="chip" aria-label="Event dates" onchange="eventRange=this.value;updateEvents()"><option value="today" ${eventRange==='today'?'selected':''}>Today</option><option value="all" ${eventRange==='all'?'selected':''}>Upcoming events</option></select><label class="switch"><input type="checkbox" ${fits?'checked':''} onchange="fits=this.checked;updateEvents()">Fits my schedule</label></div><div class="toolbar" id="categories">${[['all','All events'],['career','Career'],['community','Community'],['social','Social'],['academic','Academic'],['free','Free refreshments']].map(([k,t])=>`<button class="chip ${category===k?'active':''}" onclick="category='${k}';render()">${t}</button>`).join('')}<span id="results" class="tinydate" style="margin-left:auto">${filteredEvents().length} events to explore</span></div><div class="explore-grid" id="event-grid">${filteredEvents().length?filteredEvents().map(eventCard).join(''):'<div class="empty">No events match these filters. Try another category or turn off “Fits my schedule.”</div>'}</div>`}
function weekDates(){let d=new Date(today);d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);return Array.from({length:7},(_,i)=>{let n=new Date(d);n.setDate(d.getDate()+i);return dateKey(n)})}
function calendar(){let dates=weekDates(),items=allItems(),selected=day(agendaOffset);return heading('A little clarity for your week.','Classes, commitments, and campus life, together.')+`<div class="toolbar cal-tools"><div class="cal-nav"><button class="iconbtn" aria-label="Previous week" onclick="weekOffset--;render()">${icon('left')}</button><button class="iconbtn" aria-label="Next week" onclick="weekOffset++;render()">${icon('right')}</button><button class="btn light small" onclick="weekOffset=0;agendaOffset=0;render()">Today</button><strong style="font-size:13px;margin-left:8px">${pretty(dates[0])} – ${pretty(dates[6])}, ${localDate(dates[6]).getFullYear()}</strong></div><div style="margin-left:auto;display:flex;gap:7px"><button class="chip ${calMode==='week'?'active':''}" onclick="calMode='week';render()">Week</button><button class="chip ${calMode==='agenda'?'active':''}" onclick="calMode='agenda';render()">Agenda</button><button class="btn light small" onclick="exportICS()">${icon('download')} Export</button></div></div>${calMode==='week'?`<div class="calendar-wrap"><div class="cal-head"><div></div>${dates.map(d=>`<div class="${d===day(0)?'today':''}">${localDate(d).toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}<br><b>${localDate(d).getDate()}</b></div>`).join('')}</div><div class="cal-body"><div class="time-col">${Array.from({length:12},(_,i)=>`<span style="top:${i*55+4}px">${(i+8)%12||12} ${i+8>=12?'PM':'AM'}</span>`).join('')}</div>${dates.map(d=>{let entries=items.filter(x=>x.date===d&&x.category!=='assignment'&&mins(x.end)>480&&mins(x.start)<1200).sort((a,b)=>a.start.localeCompare(b.start));return `<div class="day-col ${d===day(0)?'today':''}">${entries.map(x=>{const overlapping=entries.filter(y=>mins(y.start)<mins(x.end)&&mins(y.end)>mins(x.start));const lane=overlapping.indexOf(x);return `<button class="cal-event ${esc(x.category)}" style="top:${Math.max(0,(mins(x.start)-480)/60*55)}px;height:${Math.max(26,(Math.min(1200,mins(x.end))-Math.max(480,mins(x.start)))/60*55-3)}px;${overlapping.length>1?`left:calc(${lane/overlapping.length*100}% + 3px);width:calc(${100/overlapping.length}% - 6px);right:auto;`:''}" onclick="itemDetails('${esc(x.id)}')"><b>${esc(x.title)}</b><small>${time(x.start)}</small></button>`}).join('')}</div>`}).join('')}</div></div><div class="legend">${[['#7960ad','Classes'],['#48715c','Personal'],['#500000','Campus events'],['#b77539','Assignments'],['#5d7d9b','University']].map(([c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}</div><section class="panel" style="margin-top:22px"><h2 style="margin-bottom:16px">Deadlines & outside calendar hours</h2>${outsideRows(items.filter(x=>dates.includes(x.date)&&(x.category==='assignment'||mins(x.start)<480||mins(x.end)>1200)))}</section>`:`<div class="daylist" style="margin-bottom:20px">${Array.from({length:7},(_,i)=>`<button class="${agendaOffset===i?'active':''}" onclick="agendaOffset=${i};render()">${i===0?'Today':pretty(day(i))}</button>`).join('')}</div><section class="panel agenda-view"><div class="section-head"><h2>${localDate(selected).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</h2></div>${agendaRows(items.filter(x=>x.date===selected))}</section>`}`}
function outsideRows(items){return items.length?items.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(x=>`<div class="event-mini" style="margin-top:8px"><div class="stat-icon">${icon(x.category==='assignment'?'book':'clock')}</div><div class="event-info"><h3>${esc(x.title)}</h3><p>${pretty(x.date)} · ${time(x.start)}${x.category==='assignment'?' deadline':''}</p></div><button class="textbtn" onclick="itemDetails('${esc(x.id)}')">Details ↗</button></div>`).join(''):'<p class="sub">No deadlines or outside-hours commitments this week.</p>'}
function settings(){return heading('Make it your own.','Bring in your calendar and keep your plans close.',false)+`<div class="split"><section class="panel settings-card"><div class="stat-icon">${icon('calendar')}</div><h2 style="margin-top:18px">Bring your calendar</h2><p>Import individual events from a calendar file (.ics). Imported events appear alongside your classes and campus plans.</p><button class="btn" onclick="document.getElementById('icsfile').click()">${icon('upload')} Import .ics file</button><p>Supports individual timed and all-day events. For recurring schedules, export individual occurrences first. This prototype skips recurring series and timezone-defined events rather than importing incorrect times.</p><div class="statusline">${state.items.filter(x=>x.imported).length} imported events</div></section><section class="panel settings-card"><div class="stat-icon">${icon('download')}</div><h2 style="margin-top:18px">Take your plans with you</h2><p>Download your combined calendar and import it into Google Calendar, Apple Calendar, or Outlook. This is a file export; calendars do not sync automatically.</p><button class="btn light" onclick="exportICS()">${icon('download')} Export my calendar</button><div class="statusline">${allItems().length} commitments in your calendar</div></section><section class="panel settings-card"><div class="stat-icon">${icon('spark')}</div><h2 style="margin-top:18px">A fresh start</h2><p>Your plans save in this browser. Reset restores sample commitments and clears your additions and saved campus events.</p><button class="btn light" onclick="askReset()">Reset demo</button></section><section class="panel settings-card"><span class="pill">ABOUT THIS PROTOTYPE</span><h2 style="margin-top:18px">Built around your day.</h2><p>Aggielander helps students organize their commitments and discover campus life that fits.</p><p>All provided classes, university reminders, locations, and campus events are fictional demo content. This is an independent student prototype, with no live university feed or university affiliation. Personal data stays in this browser.</p></section></div>`}
function render(){document.getElementById('nav').innerHTML=[['home','home','Overview'],['calendar','calendar','My calendar'],['explore','compass','Explore campus'],['settings','settings','My setup']].map(([id,ic,text])=>`<button class="navbtn ${page===id?'active':''}" ${page===id?'aria-current="page"':''} onclick="navigate('${id}')">${icon(ic)}${text}</button>`).join('');document.getElementById('app').innerHTML=({home,explore,calendar,settings}[page])()+`<footer class="bottom-note">A student-built prototype · ${liveEvents?'Campus events from calendar.tamu.edu':'Demo campus content'} · Changes saved in this browser</footer>`;}
function eventDetails(id){const e=events.find(x=>x.id===id)||(state.eventCache||{})[id];if(!e)return;showModal(`<div class="section-head"><span class="label ${e.category}">${esc(e.tag)}${e.url?'':' · DEMO EVENT'}</span>${closeButton()}</div><h2 style="font-size:22px">${esc(e.title)}</h2><p>${esc(e.description)}</p><div class="detail-line">${icon('calendar')}${pretty(e.date)} · ${time(e.start)} – ${time(e.end)}</div><div class="detail-line">${icon('pin')}${esc(e.location)}</div><p>Hosted by ${esc(e.host)}${e.url?` · <a href="${esc(e.url)}" target="_blank" rel="noopener">View on calendar.tamu.edu ↗</a>`:''}</p>${fitBadge(e)}<p style="font-size:11px">Saving adds this event to your Aggielander calendar. It does not register you for an event.</p><div class="actions"><button class="btn light" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();${state.saved.includes(e.id)?`removeEvent('${e.id}')`:`addEvent('${e.id}')`}">${state.saved.includes(e.id)?'Remove from calendar':'Add to my calendar'}</button></div>`)}
function itemDetails(id){const x=allItems().find(x=>x.id===id);if(!x)return;if(state.saved.includes(id))return eventDetails(id);showModal(`<div class="section-head"><span class="label">${esc(x.category)}${x.demo?' · DEMO':''}</span>${closeButton()}</div><h2>${esc(x.title)}</h2><div class="detail-line">${icon('calendar')}${pretty(x.date)}</div><div class="detail-line">${icon('clock')}${time(x.start)}${x.category==='assignment'?' deadline':' – '+time(x.end)}</div><div class="detail-line">${icon('pin')}${esc(x.location||'No location added')}</div><div class="actions"><button class="btn light" onclick="openForm('${esc(id)}')">Edit</button><button class="btn" onclick="deleteItem('${esc(id)}')">Remove</button></div>`)}
function deleteItem(id){state.items=state.items.filter(x=>x.id!==id);persist();closeModal();render();toast('Commitment removed')}
function openForm(id){const x=state.items.find(x=>x.id===id)||{title:'',category:'personal',date:day(0),start:'15:00',end:'16:00',location:''};showModal(`<div class="section-head"><h2>${id?'Edit':'Add a'} commitment</h2>${closeButton()}</div><form id="commit-form"><div class="field"><label for="title">What’s the plan?</label><input id="title" name="title" placeholder="Study session, assignment, coffee…" required maxlength="120" value="${esc(x.title)}"></div><div class="form-grid"><div class="field"><label for="category">Category</label><select name="category" id="category" onchange="document.getElementById('endfield').classList.toggle('hidden',this.value==='assignment');document.getElementById('startlabel').textContent=this.value==='assignment'?'Due time':'Start time'">${[['personal','Personal'],['class','Class'],['assignment','Assignment deadline'],['university','University date']].map(([k,v])=>`<option value="${k}" ${x.category===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="date">Date</label><input type="date" id="date" name="date" required value="${esc(x.date)}"></div><div class="field"><label for="start" id="startlabel">${x.category==='assignment'?'Due time':'Start time'}</label><input type="time" id="start" name="start" required value="${esc(x.start)}"></div><div class="field ${x.category==='assignment'?'hidden':''}" id="endfield"><label for="end">End time</label><input type="time" id="end" name="end" required value="${esc(x.end)}"></div></div><div class="field"><label for="location">Location (optional)</label><input id="location" name="location" placeholder="Building, room, or online" maxlength="150" value="${esc(x.location)}"></div><div id="form-error" class="error" role="alert"></div><div id="form-warning"></div><div class="actions"><button type="button" class="btn light" onclick="closeModal()">Cancel</button><button class="btn" type="submit">${id?'Save changes':'Add commitment'}</button></div></form>`);document.getElementById('commit-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let item={id:id||'custom-'+crypto.randomUUID(),title:f.get('title').trim(),category:f.get('category'),date:f.get('date'),start:f.get('start'),end:f.get('end'),location:f.get('location').trim()};if(!item.title)return;if(item.category==='assignment')item.end=item.start;else if(item.end<=item.start){document.getElementById('form-error').textContent='Choose an end time after the start time.';return}const overlaps=item.category==='assignment'?[]:conflicts(item);if(overlaps.length&&!e.target.dataset.confirmed){document.getElementById('form-warning').innerHTML=`<div class="warning">Overlaps with ${overlaps.map(o=>esc(o.title)).join(', ')}. Click save again to keep this commitment anyway.</div>`;e.target.dataset.confirmed='yes';e.target.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',()=>{delete e.target.dataset.confirmed},{once:true}));return}state.items=state.items.filter(x=>x.id!==item.id);state.items.push(item);persist();closeModal();render();toast(id?'Commitment updated':'Commitment added')}}
function askReset(){showModal(`<div class="section-head"><h2>Start fresh?</h2>${closeButton()}</div><p>This clears your additions and restores the sample schedule in this browser.</p><div class="actions"><button class="btn light" onclick="closeModal()">Keep my plans</button><button class="btn" onclick="state=seed();persist();closeModal();render();toast('Demo reset')">Reset demo</button></div>`)}
function icsEscape(v){return String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportICS(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aggielander//Student Calendar//EN','CALSCALE:GREGORIAN'];for(const x of allItems()){let start=x.date.replace(/-/g,'')+'T'+x.start.replace(':','')+'00';let end=x.date.replace(/-/g,'')+'T'+x.end.replace(':','')+'00';if(x.category==='assignment'){let d=new Date(x.date+'T'+x.start+':00');d.setMinutes(d.getMinutes()+1);end=dateKey(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00'}lines.push('BEGIN:VEVENT','UID:'+icsEscape(x.id)+'@aggielander','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+icsEscape(x.title),'LOCATION:'+icsEscape(x.location||''),'DESCRIPTION:'+icsEscape(x.category==='assignment'?'Assignment deadline':x.demo?'Aggielander demo content':'Aggielander commitment'),'END:VEVENT')}lines.push('END:VCALENDAR');let folded=lines.flatMap(l=>{let chunks=[];while(l.length>70){chunks.push(l.slice(0,70));l=' '+l.slice(70)}return [...chunks,l]});const blob=new Blob([folded.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Aggielander_Calendar.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Calendar exported')}
function parseICS(text){const blocks=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').split('BEGIN:VEVENT').slice(1);let imported=[],skipped=0;const val=s=>s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');for(const block of blocks){const props={};for(const line of block.split(/\r?\n/)){const ix=line.indexOf(':');if(ix<0)continue;const name=line.slice(0,ix),v=line.slice(ix+1);props[name.split(';')[0]]={name,value:v}}if(props.RRULE||props.RECURRENCEID||props['RECURRENCE-ID']||!props.DTSTART||props.DTSTART.name.includes('TZID=')){skipped++;continue}const raw=props.DTSTART.value;function parse(v){if(/^\d{8}$/.test(v))return {date:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),time:'00:00',allDay:true};if(!/^\d{8}T\d{6}Z?$/.test(v))return null;const s=v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8)+'T'+v.slice(9,11)+':'+v.slice(11,13)+':'+v.slice(13,15)+(v.endsWith('Z')?'Z':'');const d=new Date(s);return Number.isNaN(d.getTime())?null:{date:dateKey(d),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}let a=parse(raw),b=props.DTEND?parse(props.DTEND.value):null;if(!a){skipped++;continue}if(a.allDay){if(b){const span=(localDate(b.date)-localDate(a.date))/86400000;if(span>1){skipped++;continue}}b={date:a.date,time:'23:59'};a.time='00:00'}if(!b){let end=Math.min(1439,mins(a.time)+60);b={date:a.date,time:String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0')}}if(a.date!==b.date||b.time<=a.time){skipped++;continue}let uid=props.UID?.value||[props.SUMMARY?.value,a.date,a.time].join('-');let id='import-'+Array.from(uid).map(c=>c.charCodeAt(0).toString(16)).join('');if(state.items.some(x=>x.id===id)||imported.some(x=>x.id===id)){skipped++;continue}imported.push({id,title:val(props.SUMMARY?.value||'Imported event').slice(0,120),date:a.date,start:a.time,end:b.time,category:'personal',location:val(props.LOCATION?.value||'').slice(0,150),imported:true})}return {imported,skipped}}
document.getElementById('icsfile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw new Error('Use a calendar file smaller than 2 MB.');const content=await file.text();if(!content.includes('BEGIN:VCALENDAR'))throw new Error('Please choose a valid .ics calendar file.');const r=parseICS(content);state.items.push(...r.imported);persist();render();toast(`${r.imported.length} events imported${r.skipped?'; '+r.skipped+' unsupported or duplicate events skipped':''}`)}catch(err){toast(err.message||'Could not read this calendar file.')}e.target.value=''};
render();
fetch('/api/events').then(r=>r.ok?r.json():null).then(d=>{if(d&&d.events&&d.events.length){events=d.events;liveEvents=true;render()}}).catch(()=>{});
</script></body></html>
